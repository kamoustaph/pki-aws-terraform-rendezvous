name: Terraform CI/CD

on:
  # Lance les plans lors de l'ouverture ou de la mise à jour
  # d'une pull request dont la branche cible est main.
  pull_request:
    branches: [main]

  # Affiche le formulaire Actions > Run workflow.
  workflow_dispatch:
    inputs:
      action:
        description: "Action Terraform"
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
          - destroy

      environment:
        description: "Environnement cible"
        required: true
        default: dev
        type: choice
        options:
          - dev
          - staging
          - prod

permissions:
  contents: read

env:
  # Version cohérente avec ton poste et le verrouillage natif S3.
  TF_VERSION: "1.17.0"
  AWS_REGION: eu-west-3

  # Exécution adaptée à la CI, sans demande de saisie.
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  # =======================================================
  # Plans automatiques sur pull request
  # =======================================================
  terraform-plan-pr:
    name: plan ${{ matrix.environment }}
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'

    strategy:
      # Chaque environnement termine même si un autre échoue.
      fail-fast: false
      matrix:
        environment: [dev, staging, prod]

    defaults:
      run:
        working-directory: environments/${{ matrix.environment }}

    env:
      # Terraform reçoit le secret comme variable d'entrée.
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Terraform Plan
        # Calcule les changements sans déployer les ressources.
        run: terraform plan -input=false -no-color

  # =======================================================
  # Plan manuel sur un seul environnement
  # =======================================================
  terraform-plan-manual:
    name: plan manuel ${{ inputs.environment }}
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'plan'

    defaults:
      run:
        working-directory: environments/${{ inputs.environment }}

    env:
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Terraform Plan
        run: terraform plan -input=false -no-color

  # =======================================================
  # Déploiement manuel
  # =======================================================
  terraform-apply:
    name: apply ${{ inputs.environment }}
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'

    # Applique les protections de l'environnement GitHub choisi.
    environment:
      name: ${{ inputs.environment }}

    # Évite deux mutations simultanées depuis ce workflow
    # sur le même environnement.
    concurrency:
      group: terraform-mutation-${{ inputs.environment }}
      cancel-in-progress: false

    defaults:
      run:
        working-directory: environments/${{ inputs.environment }}

    env:
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Contrôle conservé avant les modifications AWS.
      # Il ne crée pas et ne vérifie pas lui-même le backend.
      - name: Verify remote state readiness
        env:
          REMOTE_STATE_READY: ${{ vars.TF_REMOTE_STATE_READY }}
        run: |
          if [ "$REMOTE_STATE_READY" != "true" ]; then
            echo "::error::Configurer et tester le backend distant et son verrouillage avant apply."
            exit 1
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Terraform Plan
        # Enregistre le plan qui sera appliqué à l'étape suivante.
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Terraform Apply
        # Un plan sauvegardé s'applique sans confirmation interactive.
        run: terraform apply -input=false -no-color tfplan

  # =======================================================
  # Destruction manuelle
  # =======================================================
  terraform-destroy:
    name: destroy ${{ inputs.environment }}
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'

    environment:
      name: ${{ inputs.environment }}

    concurrency:
      group: terraform-mutation-${{ inputs.environment }}
      cancel-in-progress: false

    defaults:
      run:
        working-directory: environments/${{ inputs.environment }}

    env:
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify remote state readiness
        env:
          REMOTE_STATE_READY: ${{ vars.TF_REMOTE_STATE_READY }}
        run: |
          if [ "$REMOTE_STATE_READY" != "true" ]; then
            echo "::error::Configurer et tester le backend distant et son verrouillage avant destroy."
            exit 1
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Destroy Plan
        # Prépare un plan contenant les suppressions.
        run: terraform plan -destroy -input=false -no-color -out=destroy.tfplan

      - name: Terraform Destroy
        # Exécute le plan de suppression sans saisie interactive.
        run: terraform apply -input=false -no-color destroy.tfplan