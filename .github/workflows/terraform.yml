name: Terraform CI/CD

on:
  pull_request:
    branches: [main]

  workflow_dispatch:
    inputs:
      action:
        description: 'Action terraform'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
          - destroy

      environment:
        description: 'Environment cible pour deployer'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod

env:
  TF_VERSION: 1.10.0
  AWS_REGION: eu-west-3
  EXPECTED_ROLE_ARN_SUFFIX: ':role/github-actions-role'
  EXPECTED_ACCOUNT_ID: '231644789895'

jobs:
  # Diagnostic simplifié : affiche les choix et les conditions.
  diagnostic:
    name: Diagnostic du workflow
    runs-on: ubuntu-latest

    steps:
      - name: Afficher le contexte et les conditions
        env:
          EVENT_NAME: ${{ github.event_name }}
          SELECTED_ACTION: ${{ github.event.inputs.action }}
          SELECTED_ENVIRONMENT: ${{ github.event.inputs.environment }}
          PLAN_SELECTED: ${{ github.event_name == 'pull_request' }}
          APPLY_SELECTED: ${{ github.event.inputs.action == 'apply' }}
          DESTROY_SELECTED: ${{ github.event.inputs.action == 'destroy' }}
        run: |
          echo "### 🩺 Diagnostic du workflow" >> $GITHUB_STEP_SUMMARY
          echo "- **Événement** : \`$EVENT_NAME\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Action choisie** : \`${SELECTED_ACTION:-aucune (PR)}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Environnement** : \`${SELECTED_ENVIRONMENT:-aucun (PR)}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit** : \`$GITHUB_SHA\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "| Job | Condition satisfaite |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| plan | $PLAN_SELECTED |" >> $GITHUB_STEP_SUMMARY
          echo "| apply | $APPLY_SELECTED |" >> $GITHUB_STEP_SUMMARY
          echo "| destroy | $DESTROY_SELECTED |" >> $GITHUB_STEP_SUMMARY

          if [ "$PLAN_SELECTED" = "false" ] && [ "$APPLY_SELECTED" = "false" ] && [ "$DESTROY_SELECTED" = "false" ]; then
            echo "::warning::Aucune condition de job Terraform n'est satisfaite. Les trois jobs seront ignorés."
          fi

  terraform-plan-pr:
    name: plan ${{ matrix.environment }}
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    permissions:
      id-token: write
      contents: read

    strategy:
      fail-fast: false
      matrix:
        environment: [dev, staging, prod]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # ---------------------------------------------------------------
      # 🔍 DEBUG OIDC : vérifie le secret et affiche les claims du token
      # (le token lui-même n'est jamais affiché)
      # ---------------------------------------------------------------
      - name: 🔍 Debug OIDC
        uses: actions/github-script@v7
        env:
          ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        with:
          script: |
            const arn = process.env.ROLE_ARN || '';
            const suffix = process.env.EXPECTED_ROLE_ARN_SUFFIX;
            const account = process.env.EXPECTED_ACCOUNT_ID;

            core.startGroup('1) Secret AWS_ROLE_ARN');
            core.info(`Défini                     : ${arn.length > 0}`);
            core.info(`Longueur (attendu 50)      : ${arn.length}`);
            core.info(`Commence par arn:aws:iam:: : ${arn.startsWith('arn:aws:iam::')}`);
            core.info(`Contient le bon compte     : ${arn.includes(account)}`);
            core.info(`Finit par ${suffix} : ${arn.endsWith(suffix)}`);
            core.info(`Espaces / retours ligne    : ${arn !== arn.trim()}`);
            core.endGroup();

            if (!arn) core.warning('Le secret AWS_ROLE_ARN est VIDE pour ce job (secret repository manquant ?)');
            if (arn !== arn.trim()) core.warning('Le secret AWS_ROLE_ARN contient des espaces ou un retour à la ligne');

            core.startGroup('2) Claims du token OIDC');
            let claims;
            try {
              const token = await core.getIDToken('sts.amazonaws.com');
              claims = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString());
            } catch (e) {
              core.setFailed(`Impossible d'obtenir le token OIDC : ${e.message} (permission id-token: write ? PR depuis un fork ?)`);
              return;
            }
            for (const k of ['iss', 'aud', 'sub', 'repository', 'repository_owner', 'event_name', 'ref', 'environment', 'job_workflow_ref']) {
              core.info(`${k.padEnd(18)}: ${claims[k] ?? '(absent)'}`);
            }
            core.endGroup();

            const expectedSub = `repo:${context.repo.owner}/${context.repo.repo}:pull_request`;
            core.info(`sub attendu par la trust policy : ${expectedSub}`);
            core.info(`sub reçu                        : ${claims.sub}`);
            if (claims.sub !== expectedSub) {
              core.warning(`Le sub ne correspond pas ! Mets "${claims.sub}" dans la trust policy AWS.`);
            } else {
              core.info('✅ Le sub correspond à la trust policy.');
            }

            await core.summary
              .addHeading(`🔍 Debug OIDC (${process.env.MATRIX_ENV || 'plan'})`, 3)
              .addTable([
                [{data: 'Élément', header: true}, {data: 'Valeur', header: true}],
                ['Secret défini', String(arn.length > 0)],
                ['Longueur secret (attendu 50)', String(arn.length)],
                ['sub reçu', claims.sub],
                ['sub attendu', expectedSub],
                ['aud', String(claims.aud)],
              ])
              .write();

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: ✅ Vérifier l'identité AWS
        run: aws sts get-caller-identity

      - name: Terraform Init
        working-directory: environments/${{ matrix.environment }}
        run: terraform init

      - name: Terraform Plan
        id: plan
        working-directory: environments/${{ matrix.environment }}
        run: |
          terraform plan \
            -var="db_password=${{ secrets.DB_PASSWORD }}" \
            -no-color \
            -detailed-exitcode
        continue-on-error: true

      - name: Bilan du job plan
        if: always()
        env:
          TARGET_ENVIRONMENT: ${{ matrix.environment }}
          STEPS_JSON: ${{ toJSON(steps) }}
        run: |
          {
            echo "### Bilan du plan : $TARGET_ENVIRONMENT"
            echo '```json'
            printf '%s\n' "$STEPS_JSON"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  terraform-apply:
    name: apply ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'apply'

    permissions:
      id-token: write
      contents: read

    environment:
      name: ${{ github.event.inputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: 🔍 Debug OIDC (sub)
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const c = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString());
            core.info(`sub reçu : ${c.sub}`);
            core.info(`aud      : ${c.aud}`);

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: ✅ Vérifier l'identité AWS
        run: aws sts get-caller-identity

      - name: Terraform Init
        working-directory: environments/${{ github.event.inputs.environment }}
        run: terraform init

      - name: Terraform apply
        id: apply
        working-directory: environments/${{ github.event.inputs.environment }}
        run: |
          terraform apply -auto-approve \
            -var="db_password=${{ secrets.DB_PASSWORD }}"
        continue-on-error: true

      - name: Bilan du job apply
        if: always()
        env:
          TARGET_ENVIRONMENT: ${{ github.event.inputs.environment }}
          STEPS_JSON: ${{ toJSON(steps) }}
        run: |
          {
            echo "### Bilan apply : $TARGET_ENVIRONMENT"
            echo '```json'
            printf '%s\n' "$STEPS_JSON"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  terraform-destroy:
    name: destroy ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'destroy'

    permissions:
      id-token: write
      contents: read

    environment:
      name: ${{ github.event.inputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: 🔍 Debug OIDC (sub)
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const c = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString());
            core.info(`sub reçu : ${c.sub}`);
            core.info(`aud      : ${c.aud}`);

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: ✅ Vérifier l'identité AWS
        run: aws sts get-caller-identity

      - name: Terraform Init
        working-directory: environments/${{ github.event.inputs.environment }}
        run: terraform init

      - name: Terraform destroy
        id: destroy
        working-directory: environments/${{ github.event.inputs.environment }}
        run: |
          terraform destroy -auto-approve \
            -var="db_password=${{ secrets.DB_PASSWORD }}"
        continue-on-error: true

      - name: Bilan du job destroy
        if: always()
        env:
          TARGET_ENVIRONMENT: ${{ github.event.inputs.environment }}
          STEPS_JSON: ${{ toJSON(steps) }}
        run: |
          {
            echo "### Bilan destroy : $TARGET_ENVIRONMENT"
            echo '```json'
            printf '%s\n' "$STEPS_JSON"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"